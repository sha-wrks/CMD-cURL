name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check curl is available
        run: curl --version

      - name: Validate .bat file format
        run: |
          for f in *.bat; do
            content=$(cat "$f" | tr -d '\r')
            if ! echo "$content" | grep -qE '^curl( -[^ ]+)* [^ ]+$'; then
              echo "FAIL: $f does not match expected format 'curl [flags] <url>'"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check endpoints are reachable
        run: |
          for f in *.bat; do
            content=$(cat "$f" | tr -d '\r')
            url=$(echo "$content" | sed 's/^curl\( -[^ ]*\)* //')
            if ! echo "$url" | grep -qE '^https?://'; then
              url="https://$url"
            fi
            echo "Checking $url ..."
            curl_exit=0
            curl --silent --max-time 5 --output /dev/null "$url" || curl_exit=$?
            # exit code 28 = timeout, meaning we connected and the stream started - that's OK
            if [ "$curl_exit" -ne 0 ] && [ "$curl_exit" -ne 28 ]; then
              echo "FAIL: $url (exit code $curl_exit)"
              exit 1
            fi
            echo "OK: $url"
          done
