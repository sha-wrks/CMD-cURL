name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check curl is available
        run: curl --version

      - name: Validate .bat file format
        run: |
          for f in *.bat; do
            content=$(cat "$f" | tr -d '\r')
            if ! echo "$content" | grep -qE '^curl( -[^ ]+)* [^ ]+$'; then
              echo "FAIL: $f does not match expected format 'curl [flags] <url>'"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check endpoints are reachable
        run: |
          for f in *.bat; do
            content=$(cat "$f" | tr -d '\r')
            url=$(echo "$content" | sed 's/^curl\( -[^ ]*\)* //')
            if ! echo "$url" | grep -qE '^https?://'; then
              url="https://$url"
            fi
            echo "Checking $url ..."
            curl --head --silent --max-time 10 --fail "$url" || {
              echo "FAIL: $url is not reachable"
              exit 1
            }
            echo "OK: $url"
          done
